<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Budget Together</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script>
    (function(){
      if (window.self !== window.top) {
        var vp = document.querySelector('meta[name="viewport"]');
        if (vp) vp.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover';
        try { parent.document.querySelector('.apps-script-banner')?.remove(); } catch(e){}
      }
      var z = 1;
      if (navigator.maxTouchPoints > 0 && window.screen.width > 0) {
        var _sw = window.screen.width;
        var _iw = window.innerWidth;
        if (_iw > _sw * 1.5) z = _iw / _sw;
      }
      document.documentElement.style.setProperty('--z', z);
    })();
  </script>
  <style>
    :root {
      --z: 1;
      --bg: #F0EDE6;
      --surface: #F8F2EA;
      --surface-border: #e8ddd0;
      --ring-track: #e8ddd0;
      --text: #2A2520;
      --text-2: #5A4A3A;
      --text-3: #b0a090;
      --text-sub: #7A6A58;
      --primary: #D4663A;
      --green: #3A6A3A;
      --red: #A84A2A;
      --yellow: #A08040;
      --purple: #685880;
      --p1: #6A8AAA;
      --p1-bar: #A0B8CC;
      --p2: #9A7A2A;
      --p2-bar: #C4B060;
      --radius: calc(16px * var(--z));
      --radius-sm: calc(8px * var(--z));
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      overflow: hidden;
      position: fixed;
      width: 100%;
      overscroll-behavior: none;
      touch-action: none;
    }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: var(--surface);
      color: var(--text);
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      width: 100%;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      flex-direction: column;
    }

    /* Loading */
    #status {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: calc(14px * var(--z));
    }
    .ld-dots { display: flex; gap: calc(6px * var(--z)); }
    .ld-dots div {
      width: calc(6px * var(--z));
      height: calc(6px * var(--z));
      border-radius: 50%;
      background: var(--primary);
      animation: loadDot 1.4s ease-in-out infinite;
    }
    .ld-dots div:nth-child(2) { animation-delay: 0.16s; }
    .ld-dots div:nth-child(3) { animation-delay: 0.32s; }
    @keyframes loadDot {
      0%,80%,100% { transform: scale(0.4); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }
    .ld-label {
      color: var(--text-3);
      font-size: calc(11px * var(--z));
      font-weight: 700;
      letter-spacing: calc(2px * var(--z));
      text-transform: uppercase;
    }

    /* App */
    #app { display: none; flex-direction: column; height: 100%; }
    #app.show { display: flex; flex: 1; }

    /* Month bar — inner row inside .mo-bar-wrap */
    .mo-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: calc(4px * var(--z)) calc(6px * var(--z));
      padding: calc(10px * var(--z)) calc(12px * var(--z));
    }

    /* Carousel */
    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: calc((10px + env(safe-area-inset-top)) * var(--z)) 0 0;
      gap: 0;
      flex: 1;
      align-items: stretch;
      touch-action: pan-x;
      overscroll-behavior-x: contain;
    }
    .carousel::-webkit-scrollbar { display: none; }

    /* Card */
    .card {
      flex: 0 0 100%;
      scroll-snap-align: center;
      background: var(--surface);
      border: none;
      border-radius: 0;
      padding: calc(16px * var(--z));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn .35s ease both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(.97); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Card title */
    .card-title {
      font-size: calc(22px * var(--z));
      font-weight: 800;
      letter-spacing: calc(1.5px * var(--z));
      text-transform: uppercase;
      text-align: center;
      margin-bottom: calc(8px * var(--z));
    }

    /* Stacked ring card layout */
    .rcs-section {
      flex: 0.9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .rcs-section-ring {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .rcs-number {
      font-size: calc(42px * var(--z));
      font-weight: 900;
      letter-spacing: calc(-2px * var(--z));
      line-height: 1;
      margin: calc(3px * var(--z)) 0;
    }
    .rcs-pills {
      display: flex;
      gap: calc(4px * var(--z));
      margin-top: calc(4px * var(--z));
      flex-wrap: wrap;
      justify-content: center;
    }
    .rcs-pill {
      font-size: calc(9px * var(--z));
      font-weight: 800;
      padding: calc(3px * var(--z)) calc(8px * var(--z));
      border-radius: calc(10px * var(--z));
    }
    .rcs-divider {
      height: calc(2px * var(--z));
      margin: 0 calc(28px * var(--z));
      align-self: stretch;
      flex-shrink: 0;
    }

    /* Ring */
    .rcs-ring-wrap {
      position: relative;
      width: calc(170px * var(--z));
      height: calc(170px * var(--z));
      flex-shrink: 0;
    }
    .rcs-ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .rcs-ring-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .rcs-ring-label {
      font-size: calc(7px * var(--z));
      font-weight: 800;
      letter-spacing: calc(1.5px * var(--z));
      text-transform: uppercase;
      color: var(--text-sub);
    }
    .rcs-ring-dollar {
      font-size: calc(20px * var(--z));
      font-weight: 900;
      letter-spacing: calc(-1px * var(--z));
      line-height: 1;
      margin: calc(2px * var(--z)) 0;
    }
    .rcs-ring-pct {
      font-size: calc(11px * var(--z));
      font-weight: 800;
    }

    /* Category rows — name above bar */
    .cat-row {
      padding: calc(4px * var(--z)) 0;
    }
    .cat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: calc(2px * var(--z));
    }
    .cat-header-left {
      display: flex;
      align-items: center;
      gap: calc(5px * var(--z));
    }
    .cat-header-left i {
      font-size: calc(14px * var(--z));
    }
    .cat-name {
      font-size: calc(14px * var(--z));
      font-weight: 700;
    }
    .cat-amt {
      font-size: calc(14px * var(--z));
      font-weight: 900;
    }
    .cat-bar-wrap {
      height: calc(16px * var(--z));
      border-radius: calc(8px * var(--z));
      overflow: hidden;
      display: flex;
    }


    /* Section title inside cards */
    .section-title {
      font-size: calc(22px * var(--z));
      font-weight: 800;
      letter-spacing: calc(1.5px * var(--z));
      text-transform: uppercase;
      text-align: center;
      color: var(--primary);
      margin-bottom: calc(6px * var(--z));
    }

    /* Scroll content cards */
    .card-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Dots */
    .dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: calc(6px * var(--z));
      padding: calc(8px * var(--z)) 0;
      padding-bottom: calc((8px + env(safe-area-inset-bottom)) * var(--z));
      flex-shrink: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .dots::-webkit-scrollbar { display: none; }
    .dt {
      height: calc(5px * var(--z));
      border-radius: calc(3px * var(--z));
      background: var(--surface-border);
      transition: all .3s var(--ease-out);
      width: calc(5px * var(--z));
      flex-shrink: 0;
    }
    .dt.on {
      background: var(--primary);
      width: calc(24px * var(--z));
    }

    /* Period bar (replaces plain month bar) */
    .mo-bar-wrap {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      flex-shrink: 0;
      background: var(--surface-border);
      order: 3;
      padding-bottom: calc(env(safe-area-inset-bottom) * var(--z));
    }
    .view-toggle {
      display: flex;
      justify-content: center;
      gap: calc(4px * var(--z));
      padding: calc(8px * var(--z)) calc(16px * var(--z)) 0;
    }
    .view-pill {
      font-size: calc(11px * var(--z));
      font-weight: 800;
      letter-spacing: calc(.5px * var(--z));
      text-transform: uppercase;
      padding: calc(5px * var(--z)) calc(16px * var(--z));
      border-radius: calc(20px * var(--z));
      border: none;
      background: transparent;
      color: var(--text-sub);
    }
    .view-pill.on {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 calc(1px * var(--z)) calc(3px * var(--z)) rgba(0,0,0,0.08);
    }
    .mo-arrow {
      border: none;
      background: none;
      color: var(--text);
      font-size: calc(22px * var(--z));
      line-height: 1;
      padding: calc(2px * var(--z)) calc(8px * var(--z));
    }
    .mo-arrow:disabled { color: var(--text-3); opacity: .4; }
    .mo-gear {
      position: relative;
      border: none;
      background: none;
      color: var(--text-sub);
      font-size: calc(17px * var(--z));
      line-height: 1;
      padding: calc(2px * var(--z)) calc(6px * var(--z));
    }
    /* Category-type editor rows (inside the bottom sheet) */
    .ct-row {
      display: flex;
      align-items: center;
      gap: calc(10px * var(--z));
      padding: calc(7px * var(--z)) 0;
    }
    .ct-name {
      display: flex;
      align-items: center;
      gap: calc(7px * var(--z));
      min-width: calc(110px * var(--z));
      font-size: calc(13px * var(--z));
      font-weight: 600;
      color: var(--text);
    }
    .ct-name i { font-size: calc(15px * var(--z)); flex-shrink: 0; }
    .ct-seg {
      flex: 1;
      display: flex;
      gap: 0;
      background: rgba(0,0,0,0.05);
      border-radius: calc(10px * var(--z));
      padding: calc(3px * var(--z));
    }
    .ct-seg button {
      flex: 1;
      padding: calc(6px * var(--z)) 0;
      font-size: calc(12px * var(--z));
      font-weight: 700;
      border: none;
      border-radius: calc(7px * var(--z));
      background: transparent;
      color: var(--text-3);
    }
    .ct-seg button.on {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 calc(1px * var(--z)) calc(4px * var(--z)) rgba(0,0,0,0.1);
    }
    .ct-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      margin: calc(4px * var(--z)) 0;
    }
    .ct-save-note {
      text-align: center;
      font-size: calc(11px * var(--z));
      font-weight: 600;
      color: var(--text-sub);
      min-height: calc(1.2em);
      margin-top: calc(8px * var(--z));
    }
    .ct-bet {
      border-top: 1px solid var(--line, rgba(0,0,0,0.08));
      margin-top: calc(8px * var(--z));
      padding-top: calc(10px * var(--z));
    }
    .ct-bet-title {
      font-size: calc(13px * var(--z));
      font-weight: 800;
      color: var(--text);
    }
    .ct-bet-sub {
      font-size: calc(11px * var(--z));
      color: var(--text-2);
      margin: calc(2px * var(--z)) 0 calc(8px * var(--z));
    }
    .ct-bet-btn {
      width: 100%;
      padding: calc(9px * var(--z));
      border: 1px solid var(--primary);
      border-radius: calc(9px * var(--z));
      background: #fff;
      color: var(--primary);
      font-size: calc(12px * var(--z));
      font-weight: 700;
      cursor: pointer;
    }
    .ct-bet-btn.on { background: var(--primary); color: #fff; }
    /* Data review rows (read-only transaction list) */
    .dt-date {
      font-size: calc(11px * var(--z));
      font-weight: 800;
      letter-spacing: calc(.5px * var(--z));
      text-transform: uppercase;
      color: var(--text-sub);
      padding: calc(12px * var(--z)) 0 calc(4px * var(--z));
    }
    .dt-row {
      display: flex;
      align-items: center;
      gap: calc(10px * var(--z));
      padding: calc(7px * var(--z)) 0;
      border-top: 1px solid var(--surface-border);
    }
    .dt-emoji {
      width: calc(34px * var(--z));
      height: calc(34px * var(--z));
      border-radius: calc(10px * var(--z));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: calc(16px * var(--z));
    }
    .dt-main { flex: 1; min-width: 0; }
    .dt-desc {
      font-size: calc(13px * var(--z));
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dt-meta {
      font-size: calc(10.5px * var(--z));
      color: var(--text-2);
      margin-top: calc(2px * var(--z));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dt-amt {
      font-size: calc(14px * var(--z));
      font-weight: 800;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .mo-label-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(6px * var(--z));
      border: none;
      background: none;
      font-size: calc(12px * var(--z));
      font-weight: 800;
      letter-spacing: calc(1.5px * var(--z));
      text-transform: uppercase;
      color: var(--text);
      min-width: calc(96px * var(--z));
    }
    .mo-label-btn .avg-tag {
      font-size: calc(8px * var(--z));
      font-weight: 900;
      letter-spacing: calc(.5px * var(--z));
      color: var(--primary);
      background: rgba(212,102,58,0.12);
      padding: calc(2px * var(--z)) calc(6px * var(--z));
      border-radius: calc(6px * var(--z));
    }
    .mo-label-btn .caret { font-size: calc(9px * var(--z)); color: var(--text-sub); }

    /* Avg subtitle under card titles */
    .avg-sub {
      font-size: calc(9px * var(--z));
      font-weight: 800;
      letter-spacing: calc(1.5px * var(--z));
      text-transform: uppercase;
      color: var(--text-sub);
      text-align: center;
      margin-top: calc(-4px * var(--z));
      margin-bottom: calc(8px * var(--z));
    }

    /* Period picker bottom sheet */
    .sheet-back {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.32);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 50;
      animation: fadeIn .2s ease;
    }
    .sheet {
      background: var(--surface);
      border-radius: calc(20px * var(--z)) calc(20px * var(--z)) 0 0;
      padding: calc(18px * var(--z)) calc(18px * var(--z)) calc((18px + env(safe-area-inset-bottom)) * var(--z));
      animation: sheetUp .28s var(--ease-out);
      max-height: 80%;
      display: flex;
      flex-direction: column;
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-title {
      font-size: calc(12px * var(--z));
      font-weight: 800;
      letter-spacing: calc(2px * var(--z));
      text-transform: uppercase;
      color: var(--text-sub);
      text-align: center;
      margin-bottom: calc(14px * var(--z));
    }
    .preset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(8px * var(--z)); }
    .preset-btn {
      padding: calc(12px * var(--z)) calc(4px * var(--z));
      border-radius: calc(12px * var(--z));
      border: calc(1.5px * var(--z)) solid var(--surface-border);
      background: var(--surface);
      font-size: calc(13px * var(--z));
      font-weight: 700;
      color: var(--text);
    }
    .preset-btn.on { border-color: var(--primary); background: rgba(212,102,58,0.08); color: var(--primary); }
    .month-chips {
      display: flex;
      flex-wrap: wrap;
      gap: calc(8px * var(--z));
      overflow-y: auto;
      touch-action: pan-y;
      margin-top: calc(14px * var(--z));
      padding-bottom: calc(6px * var(--z));
    }
    .month-chip {
      padding: calc(8px * var(--z)) calc(12px * var(--z));
      border-radius: calc(20px * var(--z));
      border: calc(1.5px * var(--z)) solid var(--surface-border);
      background: var(--surface);
      font-size: calc(12px * var(--z));
      font-weight: 700;
      color: var(--text-2);
    }
    .month-chip.on { border-color: var(--primary); background: var(--primary); color: #fff; }
    .sheet-done {
      margin-top: calc(16px * var(--z));
      padding: calc(13px * var(--z));
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: calc(12px * var(--z));
      font-size: calc(15px * var(--z));
      font-weight: 700;
    }
    .sheet-sub {
      font-size: calc(12px * var(--z));
      color: var(--text-3);
      text-align: center;
      line-height: 1.4;
      margin: calc(-6px * var(--z)) calc(4px * var(--z)) calc(14px * var(--z));
    }
    .gs-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(10px * var(--z)); }
    .gs-stat {
      background: var(--surface-2, rgba(0,0,0,0.03));
      border: calc(1px * var(--z)) solid var(--surface-border);
      border-radius: calc(12px * var(--z));
      padding: calc(12px * var(--z)) calc(8px * var(--z));
      text-align: center;
    }
    .gs-stat-lbl {
      font-size: calc(10px * var(--z));
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: calc(0.5px * var(--z));
      color: var(--text-3);
      margin-bottom: calc(4px * var(--z));
    }
    .gs-stat-val { font-size: calc(18px * var(--z)); font-weight: 800; }
    .gs-books-title {
      font-size: calc(11px * var(--z));
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: calc(1px * var(--z));
      color: var(--text-sub);
      margin: calc(18px * var(--z)) 0 calc(8px * var(--z));
    }
    .gs-book {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      gap: calc(2px * var(--z)) calc(10px * var(--z));
      padding: calc(10px * var(--z)) 0;
      border-top: calc(1px * var(--z)) solid var(--surface-border);
    }
    .gs-book-name { font-size: calc(14px * var(--z)); font-weight: 700; color: var(--text); }
    .gs-book-pl { font-size: calc(15px * var(--z)); font-weight: 800; grid-row: span 2; align-self: center; }
    .gs-book-meta { font-size: calc(11px * var(--z)); color: var(--text-3); }
    .gs-txns-title {
      font-size: calc(11px * var(--z));
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: calc(1px * var(--z));
      color: var(--text-sub);
      margin: calc(18px * var(--z)) 0 calc(8px * var(--z));
    }
    .gs-txn {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      gap: calc(2px * var(--z)) calc(10px * var(--z));
      padding: calc(9px * var(--z)) 0;
      border-top: calc(1px * var(--z)) solid var(--surface-border);
    }
    .gs-txn-desc { font-size: calc(13px * var(--z)); font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gs-txn-amt { font-size: calc(14px * var(--z)); font-weight: 800; align-self: center; grid-row: span 2; }

<div id="app"></div>

<script>
// Kill all vertical scrolling/bouncing at document level
document.addEventListener('touchmove', function(e) {
  // Allow touches inside the carousel (horizontal swiping) and inside any
  // scrollable sheet content (e.g. the category-type list / month chips).
  var el = e.target;
  while (el && el !== document.body) {
    if (el.classList && (el.classList.contains('carousel') || el.classList.contains('ct-list') || el.classList.contains('month-chips'))) return;
    el = el.parentNode;
  }
  e.preventDefault();
}, {passive: false});

var D, currentMonth = new Date().toISOString().slice(0,7), currentCard = 0;
// Period selection — mirrors the web app's overview ranges.
// period: '1mo' | 'ytd' | 'all' | 'custom'.  periodView: 'total' | 'avg' (multi-month only).
var period = '1mo', periodView = 'avg', customMonths = [];

// Spending categorization: fixed / variable / annual. Categories with no
// explicit type in D.catTypes fall back to this legacy default (these four
// were the original hard-coded "fixed" set); everything else is variable.
var CAT_TYPES = ['fixed', 'variable', 'annual'];
var CAT_TYPE_LABELS = {fixed:'Fixed', variable:'Variable', annual:'Annual'};
var DEFAULT_FIXED = {housing:1, utilities:1, subs:1, insurance:1};
var RET_RE = /\b(401k?|roth|retirement|pension|sep[\s-]?ira|hsa contrib)\b/i;

// Default category definitions — must mirror the web app's BASE_CATS exactly
// (same ids), since the web app owns the data. Mismatched ids (e.g. the data
// uses 'entertain', not 'entertainment') break both the category labels and
// the type editor.
var CATS = {
  groceries:   {icon:'bi-cart',             color:'#10b981', label:'Groceries'},
  dining:      {icon:'bi-cup-hot',          color:'#f43f5e', label:'Dining'},
  transport:   {icon:'bi-car-front',        color:'#3b82f6', label:'Transport'},
  entertain:   {icon:'bi-film',             color:'#8b5cf6', label:'Entertainment'},
  subs:        {icon:'bi-arrow-repeat',     color:'#6366f1', label:'Subscriptions'},
  shopping:    {icon:'bi-bag',              color:'#f59e0b', label:'Shopping'},
  health:      {icon:'bi-heart-pulse',      color:'#ef4444', label:'Health'},
  housing:     {icon:'bi-house',            color:'#06b6d4', label:'Housing'},
  utilities:   {icon:'bi-lightning',        color:'#84cc16', label:'Utilities'},
  travel:      {icon:'bi-airplane',         color:'#0284c7', label:'Travel'},
  skiing:      {icon:'bi-snow',             color:'#38bdf8', label:'Skiing'},
  annual:      {icon:'bi-calendar-event',   color:'#d946ef', label:'Annual'},
  investing:   {icon:'bi-graph-up-arrow',   color:'#16a34a', label:'Investments'},
  income:      {icon:'bi-wallet2',          color:'#22c55e', label:'Income'},
  insurance:   {icon:'bi-shield',           color:'#0ea5e9', label:'Insurance'},
  transfer:    {icon:'bi-arrow-left-right', color:'#a8b4c0', label:'Transfer'},
  other:       {icon:'bi-credit-card',      color:'#94a3b8', label:'Other'},
  gambling:    {icon:'bi-dice-5',           color:'#dc2626', label:'Gambling'},
  cash:        {icon:'bi-bank',             color:'#b45309', label:'Cash Withdrawal'}
};

function getCat(id) {
  // Check custom categories first
  var custom = (D.customCategories||[]).find(function(c){return c.id===id;});
  if (custom) return custom;
  return CATS[id] || {icon:'bi-three-dots', color:'#94a3b8', label:id};
}

function fc(n){ return '$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fc0(n){ return '$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function incType(id, desc){
  if ((D.incomeData||{})[id]) return D.incomeData[id];
  var k = (desc||'').trim().toLowerCase().replace(/\s+/g,' ');
  if (k && (D.incomeTypeRules||{})[k]) return D.incomeTypeRules[k];
  return RET_RE.test(desc) ? 'retirement' : 'normal';
}

var HIDDEN_CATS = {gambling:1, cash:1};
// Betting mode (session-only): when on, the hidden gambling/cash categories
// become visible. Only Person 1 (Jack) can turn it on — see isJack() / the
// toggle in the category settings sheet. Never persisted; auto-locks on blur.
var bettingMode = false;
function isJack(){ try { return sessionStorage.getItem('bt_person') === 'p1'; } catch(e){ return false; } }
function isHiddenCat(cat){ return !!HIDDEN_CATS[cat] && !bettingMode; }
function isIgnored(cat){
  if (isHiddenCat(cat)) return true;
  var list = [{id:'transfer',ignored:true},{id:'investing',ignored:true}].concat(D.customCategories||[]);
  var f = list.find(function(c){return c.id===cat;});
  return f ? !!f.ignored : false;
}

function catType(cat){
  var t = (D.catTypes||{})[cat];
  if (t==='fixed' || t==='variable' || t==='annual') return t;
  return DEFAULT_FIXED[cat] ? 'fixed' : 'variable';
}
function isFixedCat(cat){
  return catType(cat) === 'fixed';
}

// catSplits values are objects written by the web app: { mode:'pct'|'dollar',
// p1Pct, p1Amt }. (Older data may store a bare ratio number.) Mirror the web's
// getCatSplitAmts so mobile honors the configured split instead of always 50/50.
function getCatSplitAmts(catId, total) {
  var s = (D.catSplits || {})[catId];
  // Legacy format: a bare numeric ratio (p1's fraction).
  if (typeof s === 'number') {
    var r = isNaN(s) ? 0.5 : s;
    var p1r = total * r;
    return { p1Share: p1r, p2Share: total - p1r };
  }
  s = s || {};
  var mode = s.mode || 'pct';
  if (mode === 'dollar') {
    var p1 = Math.min(Math.max(s.p1Amt || 0, 0), total);
    return { p1Share: p1, p2Share: total - p1 };
  }
  var pct = (mode === 'pct') ? (s.p1Pct != null ? s.p1Pct : 50) : 50; // 'even' → exact 50/50
  var p1p = total * pct / 100;
  return { p1Share: p1p, p2Share: total - p1p }; // subtract so shares sum to total exactly
}
// Split shared expenses into each person's share, keyed by category.
//  • Settled transactions are frozen at their settledSplit (per transaction).
//  • Unsettled transactions follow the live category split, applied PER MONTH so
//    fixed-dollar splits apply once per month — not once across a multi-month range.
function splitSharedByCat(sharedTxns) {
  var p1 = {}, p2 = {}, liveByMoCat = {};
  for (var i=0; i<sharedTxns.length; i++) {
    var t = sharedTxns[i];
    if (t.settled && t.settledSplit != null) {
      var s = t.amount * t.settledSplit;
      p1[t.category] = (p1[t.category]||0) + s;
      p2[t.category] = (p2[t.category]||0) + (t.amount - s);
    } else {
      var key = t.date.slice(0,7) + '|' + t.category;
      liveByMoCat[key] = (liveByMoCat[key]||0) + t.amount;
    }
  }
  for (var k in liveByMoCat) {
    var cid = k.slice(k.indexOf('|')+1);
    var sh = getCatSplitAmts(cid, liveByMoCat[k]);
    p1[cid] = (p1[cid]||0) + sh.p1Share;
    p2[cid] = (p2[cid]||0) + sh.p2Share;
  }
  return { p1: p1, p2: p2 };
}
// p1/p2 share of a single shared transaction. Settled transactions are frozen
// at the split that applied when they were settled (settledSplit = p1 fraction
// 0..1); unsettled transactions follow the live category split.
function txSplitAmts(t) {
  if (t.settled && t.settledSplit != null) {
    var p1 = t.amount * t.settledSplit;
    return {p1Share: p1, p2Share: t.amount - p1};
  }
  return getCatSplitAmts(t.category, t.amount);
}
// Total p1/p2 shares across a list of shared transactions (see splitSharedByCat).
function sumSplitShares(txns) {
  var r = splitSharedByCat(txns), p1 = 0, p2 = 0;
  for (var c1 in r.p1) p1 += r.p1[c1];
  for (var c2 in r.p2) p2 += r.p2[c2];
  return {p1Share: p1, p2Share: p2};
}

function compute(who, months){
  months = months || [currentMonth];
  var msSet = {}; for (var mi=0; mi<months.length; mi++) msSet[months[mi]] = 1;
  // Divide aggregated totals by month count for the avg/mo view (ratios like savings
  // rate are unaffected since both numerator and denominator scale together).
  var div = (months.length > 1 && periodView === 'avg') ? months.length : 1;
  function sc(o){ if (div <= 1) return o; var r = {}; for (var k in o) r[k] = o[k] / div; return r; }
  var txns = (D.transactions||[]).filter(function(t){ return t.date && msSet[t.date.slice(0,7)] && !t.excluded; });
  // Gambling is netted separately (see gamblingNetFor) — never an individual expense.
  var exp = txns.filter(function(t){ return t.amount > 0 && t.category !== 'gambling' && !isIgnored(t.category); });
  var inc = txns.filter(function(t){ return t.amount < 0 && t.category === 'income'; });
  // In betting mode, collapse gambling to a single net result over the range:
  // a net win counts as income, a net loss as variable spend. E.g. $10k wagered
  // returning $11k → +$1k income, not $10k spent and $11k earned.
  function gamblingNetFor(match){
    if (!bettingMode) return 0;
    var net = 0;
    for (var gi=0; gi<txns.length; gi++){
      var gt = txns[gi];
      if (gt.category !== 'gambling' || !match(gt)) continue;
      var cl = (D.gamblingData||{})[gt.id];
      var isIn = cl ? cl.dir === 'in' : gt.amount > 0; // money sent to the book
      var amt = Math.abs(gt.amount);
      net += isIn ? -amt : amt;
    }
    return net;
  }

  if (who !== 'all') {
    // For person-specific, include solo + their share of shared
    var personInc = inc.filter(function(t){ return t.person===who; });

    var spend = 0, fixed = 0, annual = 0;
    // Solo expenses — 100% to this person
    for (var i=0; i<exp.length; i++){
      var t = exp[i];
      if (t.shared || t.person !== who) continue;
      spend += t.amount;
      var ty = catType(t.category);
      if (ty === 'fixed') fixed += t.amount;
      else if (ty === 'annual') annual += t.amount;
    }
    // Shared expenses — this person's per-month split share
    var shareByCat = splitSharedByCat(exp.filter(function(t){ return t.shared; }))[who];
    for (var cid in shareByCat){
      var amt = shareByCat[cid];
      spend += amt;
      var tyc = catType(cid);
      if (tyc === 'fixed') fixed += amt;
      else if (tyc === 'annual') annual += amt;
    }

    var totalInc = 0, ret = 0, fam = 0;
    for (var j=0; j<personInc.length; j++){
      var a = Math.abs(personInc[j].amount);
      totalInc += a;
      var tp = incType(personInc[j].id, personInc[j].description);
      if (tp==='retirement') ret += a;
      else if (tp==='family') fam += a;
    }

    var gNet = gamblingNetFor(function(gt){ return gt.person === who; });
    totalInc += Math.max(gNet, 0);   // net win → income
    spend    += Math.max(-gNet, 0);  // net loss → variable spend
    return sc({inc:totalInc, ret:ret, fam:fam, spend:spend, fixed:fixed, annual:annual, variable:spend-fixed-annual});
  }

  // Combined
  var totalSpend = 0, totalFixed = 0, totalAnnual = 0, totalInc2 = 0, totalRet = 0, totalFam = 0;
  for (var i=0; i<exp.length; i++){
    totalSpend += exp[i].amount;
    var cty = catType(exp[i].category);
    if (cty === 'fixed') totalFixed += exp[i].amount;
    else if (cty === 'annual') totalAnnual += exp[i].amount;
  }
  for (var j=0; j<inc.length; j++){
    var a2 = Math.abs(inc[j].amount);
    totalInc2 += a2;
    var tp2 = incType(inc[j].id, inc[j].description);
    if (tp2==='retirement') totalRet += a2;
    else if (tp2==='family') totalFam += a2;
  }
  var gNetAll = gamblingNetFor(function(){ return true; });
  totalInc2 += Math.max(gNetAll, 0);   // net win → income
  totalSpend += Math.max(-gNetAll, 0); // net loss → variable spend
  return sc({inc:totalInc2, ret:totalRet, fam:totalFam, spend:totalSpend, fixed:totalFixed, annual:totalAnnual, variable:totalSpend-totalFixed-totalAnnual});
}

function ringCard(title, titleColor, d, avg) {
  var normalInc = d.inc - (d.ret||0) - (d.fam||0);
  var saved = d.inc - d.spend;
  var sRate = d.inc > 0 ? Math.round(saved / d.inc * 100) : 0;
  var isLoss = saved < 0;
  var ringColor = isLoss ? 'var(--red)' : 'var(--green)';
  var ringColorRaw = isLoss ? '#A84A2A' : '#3A6A3A';
  var circ = 2 * Math.PI * 42;
  var fillPct = isLoss ? 100 : Math.max(0, Math.min(sRate, 100));
  var dashOffset = circ - (fillPct / 100) * circ;
  var savedStr = isLoss ? ('\u2212' + fc(Math.abs(saved))) : fc(saved);
  var pctStr = isLoss ? ('\u2212' + Math.abs(sRate) + '% rate') : (sRate + '% rate');

  var incPills = '<div class="rcs-pill" style="background:rgba(58,106,58,0.08);color:var(--green)">Reg ' + fc0(d.inc - (d.ret||0) - (d.fam||0)) + '</div>';
  if ((d.ret||0) > 0) incPills += '<div class="rcs-pill" style="background:rgba(160,128,64,0.08);color:var(--yellow)">Ret ' + fc0(d.ret) + '</div>';
  if ((d.fam||0) > 0) incPills += '<div class="rcs-pill" style="background:rgba(104,88,128,0.08);color:var(--purple)">Fam ' + fc0(d.fam) + '</div>';

  return '<div class="card">'
    + '<div class="card-title" style="color:' + titleColor + '">' + title + '</div>'
    + (avg ? '<div class="avg-sub">avg / month</div>' : '')
    + '<div class="rcs-section">'
    + '<div class="rcs-number" style="color:var(--green)">' + fc0(d.inc) + '</div>'
    + '<div class="rcs-pills">' + incPills + '</div>'
    + '</div>'
    + '<div class="rcs-divider" style="background:linear-gradient(90deg,transparent,var(--green),transparent)"></div>'
    + '<div class="rcs-section-ring">'
    + '<div class="rcs-ring-wrap">'
    + '<svg viewBox="0 0 100 100">'
    + '<circle cx="50" cy="50" r="42" fill="none" stroke="var(--ring-track)" stroke-width="8"/>'
    + '<circle cx="50" cy="50" r="42" fill="none" stroke="' + ringColorRaw + '" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + circ + '" stroke-dashoffset="' + dashOffset + '"/>'
    + '</svg>'
    + '<div class="rcs-ring-inner">'
    + '<div class="rcs-ring-label">SAVED</div>'
    + '<div class="rcs-ring-dollar" style="color:' + ringColor + '">' + savedStr + '</div>'
    + '<div class="rcs-ring-pct" style="color:' + ringColor + '">' + pctStr + '</div>'
    + '</div>'
    + '</div>'
    + '</div>'
    + '<div class="rcs-divider" style="background:linear-gradient(90deg,transparent,var(--red),transparent)"></div>'
    + '<div class="rcs-section">'
    + '<div class="rcs-number" style="color:var(--red)">' + fc0(d.spend) + '</div>'
    + '<div class="rcs-pills">'
    + '<div class="rcs-pill" style="background:rgba(168,74,42,0.08);color:var(--red)">Fixed ' + fc0(d.fixed) + '</div>'
    + '<div class="rcs-pill" style="background:rgba(168,74,42,0.06);color:var(--red)">Var ' + fc0(d.variable) + '</div>'
    + ((d.annual||0) > 0.005 ? '<div class="rcs-pill" style="background:rgba(212,102,58,0.10);color:var(--primary)">Annual ' + fc0(d.annual) + '</div>' : '')
    + '</div>'
    + '</div>'
    + '</div>';
}

function categoryCard(months, div, avg) {
  div = div || 1;
  var msSet = {}; for (var mi=0; mi<months.length; mi++) msSet[months[mi]] = 1;
  var exp = (D.transactions||[]).filter(function(t){ return t.date && msSet[t.date.slice(0,7)] && t.amount > 0 && t.category !== 'gambling' && !isIgnored(t.category) && !t.excluded; });
  var byCat = {};
  for (var i=0; i<exp.length; i++) {
    byCat[exp[i].category] = (byCat[exp[i].category]||0) + exp[i].amount;
  }
  var catArr = Object.entries(byCat).filter(function(e){return e[1]>0;}).sort(function(a,b){return b[1]-a[1];});
  var catTotal = catArr.reduce(function(s,e){return s+e[1];}, 0);

  // Per-person breakdown for split bars
  var p1ByCat = {}, p2ByCat = {};
  // Solo expenses — 100% to the payer
  for (var i=0; i<exp.length; i++){
    var t = exp[i];
    if (t.shared) continue;
    if (t.person==='p1') p1ByCat[t.category] = (p1ByCat[t.category]||0) + t.amount;
    else p2ByCat[t.category] = (p2ByCat[t.category]||0) + t.amount;
  }
  // Shared expenses — per-month split shares
  var sharedShares = splitSharedByCat(exp.filter(function(t){ return t.shared; }));
  for (var c1 in sharedShares.p1) p1ByCat[c1] = (p1ByCat[c1]||0) + sharedShares.p1[c1];
  for (var c2 in sharedShares.p2) p2ByCat[c2] = (p2ByCat[c2]||0) + sharedShares.p2[c2];

  var MAX_ROWS = 7;
  var visible = catArr.slice(0, MAX_ROWS);
  var overflow = catArr.slice(MAX_ROWS);
  var overflowAmt = overflow.reduce(function(s,e){return s+e[1];},0);
  if (overflowAmt > 0) visible.push(['_other', overflowAmt]);

  var rows = '';
  for (var i=0; i<visible.length; i++){
    var cid = visible[i][0], amt = visible[i][1];
    var isOther = cid === '_other';
    var c = isOther ? {icon:'bi-three-dots', color:'#94a3b8', label:overflow.length+' Other'} : getCat(cid);
    var pct = catTotal > 0 ? Math.round(amt/catTotal*100) : 0;
    var barW = catTotal > 0 ? (amt/catTotal*100).toFixed(1) : 0;
    var p1a = isOther ? overflow.reduce(function(s,e){return s+(p1ByCat[e[0]]||0);},0) : (p1ByCat[cid]||0);
    var p2a = isOther ? overflow.reduce(function(s,e){return s+(p2ByCat[e[0]]||0);},0) : (p2ByCat[cid]||0);
    var ptot = p1a+p2a;
    var p1pct = ptot>0 ? (p1a/ptot*100).toFixed(0) : 50;
    rows += '<div class="cat-row">'
      + '<div class="cat-header"><div class="cat-header-left"><i class="bi ' + c.icon + '" style="color:' + c.color + '"></i><span class="cat-name">' + c.label + '</span></div>'
      + '<span class="cat-amt">' + fc0(amt/div) + '</span></div>'
      + '<div class="cat-bar-wrap"><div style="width:' + (p1pct) + '%;background:var(--p1-bar)"></div><div style="width:' + (100-p1pct) + '%;background:var(--p2-bar)"></div></div>'
      + '</div>';
  }

  if (!rows) rows = '<div style="text-align:center;color:var(--text-3);padding:' + 18*parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--z')||'1') + 'px;font-size:13px">No expenses this period</div>';

  return '<div class="card">'
    + '<div class="section-title">Spending by Category</div>'
    + (avg ? '<div class="avg-sub">avg / month</div>' : '')
    + '<div class="card-scroll" style="display:flex;flex-direction:column;justify-content:space-evenly">' + rows + '</div>'
    + '</div>';
}

function spendingHistoryCard(periodMonths) {
  periodMonths = periodMonths || [currentMonth];
  var z = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--z')||'1');
  var txAll = D.transactions||[];
  var allMonthSet = {};
  for (var i=0; i<txAll.length; i++){
    if (txAll[i].date) allMonthSet[txAll[i].date.slice(0,7)] = true;
  }
  var allMonths = Object.keys(allMonthSet).sort().reverse().slice(0, 6);
  if (!allMonths.length) return '<div class="card"><div class="section-title">Spending History</div><div class="card-scroll" style="display:flex;align-items:center;justify-content:center"><div style="text-align:center;color:var(--text-3);font-size:' + (13*z) + 'px">No spending history yet</div></div></div>';

  var monthData = [];
  for (var mi=0; mi<allMonths.length; mi++){
    var mo = allMonths[mi];
    var moTxns = txAll.filter(function(t){ return t.date && t.date.slice(0,7)===mo && !t.excluded; });
    var exp = moTxns.filter(function(t){ return t.amount > 0 && t.category !== 'gambling' && !isIgnored(t.category); });
    var p1solo = 0, p2solo = 0;
    for (var j=0; j<exp.length; j++){
      if (!exp[j].shared) {
        if (exp[j].person==='p1') p1solo += exp[j].amount;
        else p2solo += exp[j].amount;
      }
    }
    var sharedTxns = [];
    for (var j=0; j<exp.length; j++){ if (exp[j].shared) sharedTxns.push(exp[j]); }
    var shr = sumSplitShares(sharedTxns);
    var p1shared = shr.p1Share, p2shared = shr.p2Share;
    var p1total = p1solo + p1shared;
    var p2total = p2solo + p2shared;
    monthData.push({mo:mo, total:p1total+p2total, p1total:p1total, p2total:p2total});
  }

  var maxTotal = 1;
  for (var i=0; i<monthData.length; i++) maxTotal = Math.max(maxTotal, monthData[i].total);

  var cards = '';
  for (var i=0; i<monthData.length; i++){
    var d = monthData[i];
    var isCur = periodMonths.indexOf(d.mo) >= 0;
    var parts = d.mo.split('-');
    var label = new Date(+parts[0], +parts[1]-1, 1).toLocaleDateString('en-US', {month:'short'}) + " '" + parts[0].slice(2);
    var barW = d.total > 0 ? (d.total / maxTotal * 100).toFixed(1) : 0;
    var p1pct = d.total > 0 ? (d.p1total / d.total * 100).toFixed(1) : 50;
    var monthColor = isCur ? 'var(--primary)' : 'var(--text)';
    var shadow = isCur
      ? 'box-shadow:0 ' + (2*z) + 'px ' + (8*z) + 'px rgba(180,100,50,0.12),0 ' + (1*z) + 'px ' + (2*z) + 'px rgba(0,0,0,0.04);background:rgba(255,255,255,0.4);'
      : 'box-shadow:0 ' + (1*z) + 'px ' + (3*z) + 'px rgba(0,0,0,0.03);background:rgba(255,255,255,0.2);opacity:0.4;';

    cards += '<div style="border-radius:' + (10*z) + 'px;padding:' + (6*z) + 'px ' + (8*z) + 'px;display:flex;flex-direction:column;gap:' + (3*z) + 'px;' + shadow + '">'
      + '<div style="display:flex;justify-content:space-between;align-items:baseline;">'
      + '<div style="font-size:' + (13*z) + 'px;font-weight:900;color:' + monthColor + ';">' + label + '</div>'
      + '<div style="font-size:' + (11*z) + 'px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums;">' + fc0(d.total) + '</div>'
      + '</div>'
      + '<div style="height:' + (14*z) + 'px;border-radius:' + (7*z) + 'px;overflow:hidden;display:flex;background:rgba(0,0,0,0.04);">'
      + '<div style="display:flex;height:100%;width:' + barW + '%;border-radius:' + (7*z) + 'px;overflow:hidden;">'
      + '<div style="width:' + p1pct + '%;background:var(--p1-bar);"></div>'
      + '<div style="width:' + (2.5*z) + 'px;background:var(--surface);flex-shrink:0;"></div>'
      + '<div style="flex:1;background:var(--p2-bar);"></div>'
      + '</div></div>'
      + '<div style="display:flex;gap:' + (10*z) + 'px;">'
      + '<span style="font-size:' + (8*z) + 'px;font-weight:700;color:var(--p1);">' + fc0(d.p1total) + '</span>'
      + '<span style="font-size:' + (8*z) + 'px;font-weight:700;color:var(--p2);">' + fc0(d.p2total) + '</span>'
      + '</div></div>';
  }

  return '<div class="card">'
    + '<div class="section-title">Spending History</div>'
    + '<div class="card-scroll" style="display:flex;flex-direction:column;justify-content:space-evenly;gap:' + (3*z) + 'px">' + cards + '</div>'
    + '</div>';
}

function moLabel(ym){
  var p=ym.split('-'); return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
}
function monShort(ym){ var p=ym.split('-'); return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-US',{month:'short'}); }
function moShift(delta){
  var p=currentMonth.split('-'), d=new Date(+p[0],+p[1]-1+delta,1);
  currentMonth = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  render();
}

// ── Period (range) helpers — mirror the web app's overview ranges ──────────
function allDataMonths(){
  var s={}, tx=D.transactions||[];
  for (var i=0;i<tx.length;i++){ if(tx[i].date) s[tx[i].date.slice(0,7)]=1; }
  var arr=Object.keys(s).sort();
  if (arr.indexOf(currentMonth)<0){ arr.push(currentMonth); arr.sort(); }
  return arr;
}
function getPeriodMonths(){
  var all=allDataMonths();
  if (!all.length) return [currentMonth];
  var yr=currentMonth.slice(0,4);
  switch(period){
    case 'ytd':    return all.filter(function(m){ return m.slice(0,4)===yr && m<=currentMonth; });
    case 'all':    return all.slice();
    case 'custom': return customMonths.length ? all.filter(function(m){ return customMonths.indexOf(m)>=0; }) : [currentMonth];
    default:       return [currentMonth]; // '1mo'
  }
}
function periodLabel(months){
  if (months.length<=1) return moLabel(months[0]||currentMonth);
  if (period==='all') return 'All Time';
  if (period==='ytd') return currentMonth.slice(0,4)+' YTD';
  if (period==='custom') return 'Custom · '+months.length+' mo';
  var a=months[0], b=months[months.length-1];
  if (a.slice(0,4)===b.slice(0,4)) return monShort(a)+' – '+monShort(b)+' '+b.slice(0,4);
  return monShort(a)+" '"+a.slice(2,4)+' – '+monShort(b)+" '"+b.slice(2,4);
}
function shiftPeriod(delta){
  if (period==='all') return;
  if (period==='ytd'){
    var p=currentMonth.split('-'); currentMonth=(+p[0]+delta)+'-'+p[1]; render(); return;
  }
  if (period==='custom'){
    if (!customMonths.length){ moShift(delta); return; }
    customMonths = customMonths.map(function(m){ var q=m.split('-'); var d=new Date(+q[0],+q[1]-1+delta,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); });
    render(); return;
  }
  moShift(delta); // '1mo'
}
function setPeriod(p){
  period=p;
  if (p==='custom' && !customMonths.length) customMonths = allDataMonths().slice(-3);
  render();
  if (p==='custom') refreshSheet(); else closeSheet();
}
function setPeriodView(v){ periodView=v; render(); }

function closeSheet(){ var b=document.getElementById('sheet-back'); if(b) b.remove(); }

// ── Gambling summary (betting mode only) ───────────────────────────────────
// All-time gambling P&L plus a per-book breakdown. The same classification the
// web app uses (gamblingData dir, else amount sign) decides money-in vs money-out.
var GAMBLING_BOOKS = {
  fanduel:'FanDuel', draftkings:'DraftKings', coincasino:'CoinCasino',
  kalshi:'Kalshi', inperson:'In Person', other:'Other'
};
function detectBook(desc){
  var d = (desc||'').toLowerCase();
  if (d.indexOf('fanduel')>=0) return 'fanduel';
  if (d.indexOf('draftkings')>=0) return 'draftkings';
  if (d.indexOf('coincasino')>=0 || d.indexOf('coin casino')>=0) return 'coincasino';
  if (d.indexOf('kalshi')>=0) return 'kalshi';
  return 'other';
}
function openGamblingSheet(){
  if (!bettingMode) return;
  if (document.getElementById('sheet-back')) return;
  var b=document.createElement('div');
  b.id='sheet-back'; b.className='sheet-back';
  b.addEventListener('click', function(e){ if(e.target===b) closeSheet(); });
  document.body.appendChild(b);

  var all = (D.transactions||[]).filter(function(t){ return t.category==='gambling' && !t.excluded; })
    .sort(function(a,b){ return b.date.localeCompare(a.date); });
  var totalIn = 0, totalOut = 0, byBook = {};
  for (var i=0;i<all.length;i++){
    var t = all[i], cl = (D.gamblingData||{})[t.id];
    var isIn = cl ? cl.dir==='in' : t.amount > 0;
    var amt = Math.abs(t.amount);
    var bid = (cl && cl.book) || detectBook(t.description);
    if (!byBook[bid]) byBook[bid] = {inAmt:0, outAmt:0, count:0};
    if (isIn){ totalIn += amt; byBook[bid].inAmt += amt; }
    else { totalOut += amt; byBook[bid].outAmt += amt; }
    byBook[bid].count++;
  }
  var net = totalOut - totalIn;
  var netColor = net>=0 ? 'var(--green)' : 'var(--red)';
  var netStr = (net>=0?'+':'−') + fc(Math.abs(net));

  var bookIds = Object.keys(byBook).sort(function(a,c){
    return (byBook[c].inAmt+byBook[c].outAmt) - (byBook[a].inAmt+byBook[a].outAmt);
  });
  var bookRows = '';
  for (var j=0;j<bookIds.length;j++){
    var bid2 = bookIds[j], bk = byBook[bid2], pl = bk.outAmt - bk.inAmt;
    var plC = pl>=0 ? 'var(--green)' : 'var(--red)';
    var plS = (pl>=0?'+':'−') + fc(Math.abs(pl));
    bookRows += '<div class="gs-book">'
      + '<div class="gs-book-name">' + esc(GAMBLING_BOOKS[bid2]||bid2) + '</div>'
      + '<div class="gs-book-meta">' + fc(bk.inAmt) + ' in · ' + fc(bk.outAmt) + ' back · ' + bk.count + ' txn' + (bk.count!==1?'s':'') + '</div>'
      + '<div class="gs-book-pl" style="color:' + plC + '">' + plS + '</div>'
      + '</div>';
  }

  // Individual transactions — newest first, same in/out classification as above.
  var txnRows = '';
  for (var k=0;k<all.length;k++){
    var tt = all[k], tcl = (D.gamblingData||{})[tt.id];
    var tIsIn = tcl ? tcl.dir==='in' : tt.amount > 0;
    var tAmt = Math.abs(tt.amount);
    var tBid = (tcl && tcl.book) || detectBook(tt.description);
    var tC = tIsIn ? 'var(--red)' : 'var(--green)';
    var tS = (tIsIn?'−':'+') + fc(tAmt);
    txnRows += '<div class="gs-txn">'
      + '<div class="gs-txn-desc">' + esc(tt.description || '(no description)') + '</div>'
      + '<div class="gs-txn-amt" style="color:' + tC + '">' + tS + '</div>'
      + '<div class="gs-txn-meta">' + esc(tt.date) + ' · ' + esc(GAMBLING_BOOKS[tBid]||tBid) + ' · ' + (tIsIn?'in':'back') + '</div>'
      + '</div>';
  }

  var body = all.length
    ? '<div class="gs-stats">'
        + '<div class="gs-stat"><div class="gs-stat-lbl">Net P&amp;L</div><div class="gs-stat-val" style="color:' + netColor + '">' + netStr + '</div></div>'
        + '<div class="gs-stat"><div class="gs-stat-lbl">Total In</div><div class="gs-stat-val" style="color:var(--red)">' + fc(totalIn) + '</div></div>'
        + '<div class="gs-stat"><div class="gs-stat-lbl">Total Out</div><div class="gs-stat-val" style="color:var(--green)">' + fc(totalOut) + '</div></div>'
      + '</div>'
      + (bookRows ? '<div class="gs-books-title">By Book</div>' + bookRows : '')

    for (var m=0;m<txns.length;m++) body+=dtRowHtml(txns[m], n1, n2, true);

// ── CSV import + classify ──────────────────────────────────────────────────
// Ports the web app's CSV upload + grouped review flow to mobile. Parsing,
// auto-categorization and rule-learning mirror docs/index.html exactly so both
// clients produce identical transactions. PDF/paystub import stays web-only
// (it needs the pdf.js CDN library and much heavier parsers).
var _uid = 0;
function uid(){ return Date.now().toString(36) + (++_uid).toString(36) + Math.random().toString(36).slice(2); }
function fmtDate(d){ if(!d) return ''; var p=String(d).split('-'); if(p.length<3) return d; return p[1]+'/'+p[2]+'/'+p[0].slice(2); }
function parseAmt(s){ if(s===''||s==null) return null; var v=String(s).replace(/[$,\s]/g,'').replace(/\(([^)]+)\)/,'-$1').replace(/cr$/i,''); var n=parseFloat(v); return isNaN(n)?null:n; }
function parseDt(s){
  if(!s) return null; s=String(s).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  var m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){ var mo=m[1], d=m[2], y=m[3]; if(y.length===2) y='20'+y; return y+'-'+mo.padStart(2,'0')+'-'+d.padStart(2,'0'); }
  var dd=new Date(s);
  if(!isNaN(dd.getTime())){ return dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0'); }
  return null;
}

function categorize(desc){ if(!desc) return 'other'; var d=desc.toLowerCase(); for(var cat in KW){ var kws=KW[cat]; for(var i=0;i<kws.length;i++){ if(d.indexOf(kws[i])>=0) return cat; } } return 'other'; }
function normalizeDesc(desc){
  if(!desc) return '';
  return desc.toLowerCase().replace(/\d+/g,'').replace(/[#*@\/\\,\.&!]/g,'').replace(/\s+/g,' ').trim()
    .split(' ').filter(function(w){return w.length>0;}).slice(0,3).join(' ');
}

// CSV parsing (verbatim port of the web app's helpers).
function splitCSVLine(line){
  var res=[], cur='', inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){ if(inQ && line[i+1]==='"'){ cur+='"'; i++; } else inQ=!inQ; }
    else if((c===','||c==='\t') && !inQ){ res.push(cur.trim()); cur=''; }
    else cur+=c;
  }
  res.push(cur.trim());
  return res;
}
function parseCSV(text){
  var lines=text.trim().split(/\r?\n/);
  if(!lines.length) return {headers:[], rows:[]};
  var headers=splitCSVLine(lines[0]).map(function(h){return h.replace(/^["']|["']$/g,'');});
  var rows=lines.slice(1).filter(function(l){return l.trim();}).map(function(l){
    var vals=splitCSVLine(l), o={};
    for(var i=0;i<headers.length;i++){ o[headers[i]]=(vals[i]||'').replace(/^["']|["']$/g,''); }
    return o;
  });
  return {headers:headers, rows:rows};
}
function detectCols(headers){
  var lo=headers.map(function(h){return h.toLowerCase().trim();});
  function find(){ for(var a=0;a<arguments.length;a++){ var p=arguments[a]; for(var i=0;i<lo.length;i++){ if(lo[i].indexOf(p)>=0) return headers[i]; } } return null; }
  return {
    dateCol:  find('transaction date','trans. date','trans date','date'),
    descCol:  find('description','merchant','payee','name','memo','details'),
    amtCol:   find('amount'),
    debitCol: find('debit'),
    creditCol:find('credit'),
  };
}
function rowsToTxns(rows, map, person){
  var out=[];
  for(var r=0;r<rows.length;r++){
    var row=rows[r];
    var date=parseDt(row[map.dateCol]);
    var description=(row[map.descCol]||'').trim();
    if(!date||!description) continue;
    var amount;
    if(map.amtCol && row[map.amtCol]!==undefined){
      var v=parseAmt(row[map.amtCol]); if(v===null) continue;
      amount=map.invert ? -v : v;
    } else if(map.debitCol||map.creditCol){
      var deb=map.debitCol ? parseAmt(row[map.debitCol]) : null;
      var cred=map.creditCol ? parseAmt(row[map.creditCol]) : null;
      if(deb && Math.abs(deb)>0) amount=Math.abs(deb);
      else if(cred && Math.abs(cred)>0) amount=-Math.abs(cred);
      else continue;
    } else continue;
    if(amount===null||isNaN(amount)) continue;
    out.push({id:uid(), date:date, description:description, amount:amount, category:categorize(description), person:person, shared:false, settled:false, splitRatio:0.5, note:'', excluded:false});
  }
  return out;
}
// Venmo CSV (non-standard multi-row header).
function isVenmoCSV(text){ return text.indexOf('Account Statement')>=0 && text.indexOf('Amount (total)')>=0 && text.indexOf('Datetime')>=0; }
function parseVenmoToTxns(text, person){
  var lines=text.split(/\r?\n/);
  var headerIdx=-1;
  for(var i=0;i<lines.length;i++){ if(lines[i].indexOf('Datetime')>=0 && lines[i].indexOf('Amount (total)')>=0){ headerIdx=i; break; } }
  if(headerIdx<0) return [];
  var headers=splitCSVLine(lines[headerIdx]).map(function(h){return h.replace(/^["']|["']$/g,'');});
  function col(name){ return headers.indexOf(name); }
  var iDatetime=col('Datetime'), iType=col('Type'), iStatus=col('Status'), iNote=col('Note'), iFrom=col('From'), iTo=col('To'), iAmt=col('Amount (total)');
  if(iDatetime<0||iAmt<0) return [];
  var txns=[];
  for(var j=headerIdx+1;j<lines.length;j++){
    var cols=splitCSVLine(lines[j]).map(function(c){return c.replace(/^["']|["']$/g,'');});
    var status=cols[iStatus]||'', type=cols[iType]||'';
    if(status!=='Complete' && status!=='Issued') continue;
    var date=parseDt(cols[iDatetime]||''); if(!date) continue;
    var amtStr=cols[iAmt]||'';
    var amtMatch=amtStr.replace(/,/g,'').match(/([+\-])\s*\$?([\d.]+)/);
    if(!amtMatch) continue;
    var venmoSign=amtMatch[1]==='+' ? 1 : -1;
    var absVal=parseFloat(amtMatch[2]); if(isNaN(absVal)) continue;
    var amount=-(venmoSign*absVal);
    var note=(cols[iNote]||'').trim(), from=(cols[iFrom]||'').trim(), to=(cols[iTo]||'').trim();
    var description, category;
    if(type==='Standard Transfer'){ description='Venmo Transfer'; category='transfer'; }
    else {
      var counterparty=venmoSign>0 ? from : to;
      var direction=venmoSign>0 ? 'from' : 'to';
      var base=note||counterparty||'Venmo Payment';

function parseCoinbaseToTxns(text, person){

  for(var i=0;i<lines.length;i++){ if(lines[i].indexOf('Transaction Type')>=0 && lines[i].indexOf('Timestamp')>=0){ headerIdx=i; break; } }
  if(headerIdx<0) return [];
  var headers=splitCSVLine(lines[headerIdx]).map(function(h){return h.replace(/^["']|["']$/g,'');});
  function col(name){ for(var i=0;i<headers.length;i++){ if(headers[i]===name) return i; } return -1; }

var _pdfJsLoad = null;

  if(window.pdfjsLib) return Promise.resolve();

    _pdfJsLoad = new Promise(function(res, rej){
      var s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=res;
      s.onerror=function(){ _pdfJsLoad=null; rej(new Error('PDFLIB')); };
      document.head.appendChild(s);
    }).then(function(){

    });

function extractPdfText(file){

    var _p = function(i){
      return pdf.getPage(i).then(function(page){
        var vp=page.getViewport({scale:1});
        return page.getTextContent().then(function(content){
          var items=[];
          for(var c=0;c<content.items.length;c++){
            var item=content.items[c];
            if(!item.str.trim()) continue;
            items.push({ x:item.transform[4], y:Math.round(vp.height-item.transform[5]), w:item.width*Math.abs(item.transform[0]), str:item.str });
          }
          items.sort(function(a,b){ return a.y!==b.y ? a.y-b.y : a.x-b.x; });
          var lineMap={};
          for(var k=0;k<items.length;k++){ var it=items[k]; var bucket=Math.round(it.y/4)*4; if(!lineMap[bucket]) lineMap[bucket]=[]; lineMap[bucket].push(it); }
          var lines=Object.keys(lineMap).sort(function(a,b){return a-b;}).map(function(key){
            var row=lineMap[key], line=row[0].str;
            for(var j=1;j<row.length;j++){ var gap=row[j].x-(row[j-1].x+row[j-1].w); line+=(gap>1?' ':'')+row[j].str; }
            return line;
          });
          return lines.join('\n');
        });
      });
    };
    var texts=[];
    for(var i=1;i<=pdf.numPages;i++){
      (function(n){ pageChain=pageChain.then(function(){ return _p(n).then(function(t){ texts.push(t); }); }); })(i);

    if(depM){ var vd=stubAmt(depM[1]); if(vd&&vd>0){ result.netPay=vd; addEntry({label:'Net Pay (take-home)',amount:vd,category:'income',type:'income',checked:true}); } }
  }
  result.person=(function(){
    if(!result.employeeName) return 'p1';
    var name=result.employeeName.toLowerCase();
    var p1=((D.settings||{}).person1||'').toLowerCase().split(' ');
    var p2=((D.settings||{}).person2||'').toLowerCase().split(' ');
    if(p2.some(function(w){return w.length>2 && name.indexOf(w)>=0;})) return 'p2';
    if(p1.some(function(w){return w.length>2 && name.indexOf(w)>=0;})) return 'p1';
    return 'p1';
  })();
  return result;
}

var _psData = null;
function showPaystubSheet(parsed){

function renderPaystubSheet(){

    +'</div>'

      +'<button class="cf-owner" onclick="psSetPerson(\'p2\')" style="'+(!p1sel?'border-color:var(--p2);color:var(--p2);background:rgba(154,122,42,0.14)':'')+'">'+esc(n2)+'</button>'
    +'</div>'

}
function psToggle(i, val){ if(_psData) _psData.parsed.entries[i].checked=val; }
function psSetPerson(p){ if(_psData) _psData.person=p; renderPaystubSheet(); }
function psAfter(){ if(pendingPaystubs.length) showPaystubSheet(pendingPaystubs[0]); else if(pendingReview.length) openClassifySheet(); else closeSheet(); }
function psSkip(){ pendingPaystubs.shift(); psAfter(); }
function psImport(){
  if(!_psData) return;
  var parsed=_psData.parsed, person=_psData.person;
  var dateIso=parsed.payDateIso || (currentMonth+'-13');
  var chosen=parsed.entries.filter(function(e){ return e.checked; });
  if(!chosen.length){ moToast('Select at least one item'); return; }
  var newTx=(D.transactions||[]).slice();
  // This path pushes straight to the ledger, so unlike doImportTxnsMobile it
  // never had a duplicate check — re-importing a paystub doubled every line.
  var existing={};
  newTx.forEach(function(t){ existing[t.date+'|'+t.description+'|'+t.amount+'|'+t.person]=1; });
  var added=0;
  function addRow(description, amount, category){
    var key=dateIso+'|'+description+'|'+amount+'|'+person;
    if(existing[key]) return false;
    existing[key]=1; added++;
    newTx.push({id:uid(), date:dateIso, amount:amount, description:description, category:category,
      person:person, note:'paystub', shared:false, settled:false, splitRatio:0.5, excluded:false});
    return true;
  }
  chosen.forEach(function(e){ addRow(e.label, e.type==='expense' ? e.amount : -e.amount, e.category); });
  // Pre-tax deductions are compensation that never showed up in take-home, so
  // they're grossed up: one income line covering the premiums booked as expenses
  // alongside it. Net effect on what's left over is zero — the cost just becomes
  // visible. (Same treatment 401k/HSA already get, which count as income too.)
  var deductions=chosen.filter(function(e){ return e.type==='expense'; }).reduce(function(s,e){ return s+e.amount; }, 0);
  if(deductions>0) addRow('Pre-tax Benefits', -(Math.round(deductions*100)/100), 'income');
  if(!added){
    moToast('Already imported — nothing new');
    pendingPaystubs.shift(); psAfter();
    return;
  }
  var candidate=Object.assign({}, D, {transactions:newTx});
  cfSavingOverlay('Saving paystub…', false, 'renderPaystubSheet');
  moWriteData(candidate, function(written){
    D=written||candidate;
    currentMonth=dateIso.slice(0,7);
    var nInc=chosen.filter(function(e){return e.type==='income';}).length;
    var nExp=chosen.filter(function(e){return e.type==='expense';}).length;
    pendingPaystubs.shift();
    render();
    moToast('✅ Imported '+(nInc?nInc+' income':'')+(nInc&&nExp?' + ':'')+(nExp?nExp+' expense':'')+' item'+(chosen.length!==1?'s':''));
    psAfter();
  }, function(err){
    cfSavingOverlay(err && err.message==='TOKEN' ? 'Save failed — token can’t write' : 'Save failed — check connection', true, 'renderPaystubSheet');
  });
}

// ── Import orchestration ───────────────────────────────────────────────────
var pendingReview = [];
var reviewGroups = [];
var groupIdx = 0;
var rowCatExpandIdx = -1;
var reviewSearch = '';
var moMapCtx = null;       // active column-map context
var _moMapResolve = null;  // resolves the import loop while a column-map sheet is open

function moToast(msg){

  if(!el){ el=document.createElement('div'); el.id='mo-toast'; el.className='mo-toast'; document.body.appendChild(el); }
  el.textContent=msg; el.classList.add('show');

function curPerson(){ try { return sessionStorage.getItem('bt_person')||'p1'; } catch(e){ return 'p1'; } }

function openImportSheet(){
  if(document.getElementById('sheet-back')) return;

function moPickFile(person){
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='.csv,.pdf,text/csv,text/plain,text/comma-separated-values,application/pdf';
  inp.multiple=true;
  inp.style.position='fixed'; inp.style.left='-9999px'; inp.style.top='0';
  document.body.appendChild(inp);
  inp.addEventListener('change', function(){
    var files=Array.prototype.slice.call(inp.files||[]);
    try { document.body.removeChild(inp); } catch(e){}
    if(!files.length) return;
    closeSheet();
    moStartImport(files, person);
  });
  inp.click();
}
function moReadText(file){
  return new Promise(function(res, rej){
    var r=new FileReader();
    r.onload=function(e){ res(String(e.target.result||'')); };
    r.onerror=function(){ rej(new Error('read')); };
    r.readAsText(file);
  });
}
// Process each picked file in order. CSV/statement rows accumulate into the
// classify queue; paystubs into pendingPaystubs. A column-map sheet pauses the
// loop (await) until the user applies or skips it. When every file is done we
// show paystub sheets first, then the classify sheet.
function moStartImport(files, person){
  moMapCtx=null; _moMapResolve=null;
  var hasPdf=files.some(function(f){ return /\.pdf$/i.test(f.name); });
  if(hasPdf) moToast(files.length>1 ? 'Reading files…' : 'Reading PDF…');
  var chain=Promise.resolve();
  files.forEach(function(f){
    chain=chain.then(function(){
      if(/\.pdf$/i.test(f.name)){
        return moProcessPdf(f, person).catch(function(e){
          moToast(e && e.message==='PDFLIB' ? 'Could not load PDF reader (offline?)' : 'Could not read '+(f.name||'PDF'));
        });
      }
      return moReadText(f).then(function(text){ return moProcessCsvText(text, person); })
        .catch(function(){ moToast('Could not read '+(f.name||'file')); });
    });
  });
  chain.then(function(){
    if(pendingPaystubs.length){ showPaystubSheet(pendingPaystubs[0]); return; }
    if(pendingReview.length){ openClassifySheet(); return; }
    moToast('Nothing new to import'); closeSheet();
  });
}
function moProcessPdf(file, person){
  return extractPdfText(file).then(function(text){
    if(isCNBStatement(text)){ var t=parseCNBStatement(text, person); if(!t.length) moToast('No transactions in CNB statement'); else doImportTxnsMobile(t); return; }
    if(isChaseStatement(text)){ var t2=parseChaseStatement(text, person); if(!t2.length) moToast('No transactions in Chase statement'); else doImportTxnsMobile(t2); return; }
    if(isSoFiStatement(text)){ var t3=parseSoFiStatement(text, person); if(!t3.length) moToast('No transactions in SoFi statement'); else doImportTxnsMobile(t3); return; }
    var parsed=parsePaystubText(text);
    if(person && !parsed.employeeName) parsed.person=person;
    if(!parsed.entries.length && !parsed.payDate){ moToast('Could not recognize PDF format'); return; }
    pendingPaystubs.push(parsed);
  });
}
function moProcessCsvText(text, person){
  return new Promise(function(resolve){
    if(isVenmoCSV(text)){ var vt=parseVenmoToTxns(text, person); if(!vt.length) moToast('No transactions in Venmo CSV'); else doImportTxnsMobile(vt); return resolve(); }
    if(isCoinbaseCSV(text)){ var ct=parseCoinbaseToTxns(text, person); if(!ct.length) moToast('No transactions in Coinbase CSV'); else doImportTxnsMobile(ct); return resolve(); }
    var p=parseCSV(text);
    if(!p.headers.length||!p.rows.length){ moToast('Could not read CSV'); return resolve(); }
    var det=detectCols(p.headers);
    if(det.dateCol && det.descCol && (det.amtCol||det.debitCol||det.creditCol)){
      var invert=false;
      if(det.amtCol){ var samp=p.rows.slice(0,15).map(function(r){return parseAmt(r[det.amtCol]);}).filter(function(n){return n!==null;}); invert=samp.some(function(n){return n<0;}); }
      doImportTxnsMobile(rowsToTxns(p.rows, {dateCol:det.dateCol, descCol:det.descCol, amtCol:det.amtCol, debitCol:det.debitCol, creditCol:det.creditCol, invert:invert}, person));
      return resolve();
    }
    // Undetectable — show the column-map sheet and resume when applied/skipped.
    _moMapResolve=resolve;
    moShowMapSheet(p.headers, p.rows, det, person);
  });
}
function doImportTxnsMobile(txns){
  var existing={};
  (D.transactions||[]).forEach(function(t){ existing[t.date+'|'+t.description+'|'+t.amount+'|'+t.person]=1; });
  var fresh=txns.filter(function(t){ return !existing[t.date+'|'+t.description+'|'+t.amount+'|'+t.person]; });
  if(!fresh.length){ moToast('No new transactions found'); return; }
  // Pre-fill category/owner from learned rules, but always require review.
  fresh.forEach(function(t){
    var rule=applyRules(t.description);
    if(rule){ t.category=rule.category; if(rule.shared!==undefined) t.shared=rule.shared; if(rule.person) t.person=rule.person; }
  });
  pendingReview.push.apply(pendingReview, fresh);
  moToast('📋 '+fresh.length+' added to review');
}

function moMapApply(){

  else invert=invV==='1';

// ── Grouped classify sheet ─────────────────────────────────────────────────
function buildReviewGroups(){
  var map={}, order=[];
  for(var i=0;i<pendingReview.length;i++){
    var t=pendingReview[i];
    var key=normalizeDesc(t.description) || (t.description||'').slice(0,20);
    if(!map[key]){ map[key]=[]; order.push(key); }
    map[key].push(t);
  }
  return order.map(function(k){ return map[k]; }).sort(function(a,b){ return b.length-a.length; });
}
function getFilteredGroups(){
  if(!reviewSearch.trim()) return reviewGroups;
  var q=reviewSearch.trim().toLowerCase();
  return reviewGroups.filter(function(g){
    var d=g[0].description||'';
    return d.toLowerCase().indexOf(q)>=0 || normalizeDesc(d).indexOf(q)>=0;
  });
}
function currentGroup(){ return getFilteredGroups()[groupIdx]; }
function cfSetSearch(q){

// ── GitHub data store ──────────────────────────────────────
// Reads the budget for the dashboard, and can write back the small set of
// settings the mobile app is allowed to change (category types).
var GH = {
  get repo(){ return localStorage.getItem('bt_gh_repo') || 'jackdengler/private-data-storage'; },
  get path(){ return localStorage.getItem('bt_gh_path') || 'budget.json'; },
  get branch(){ return localStorage.getItem('bt_gh_branch') || 'main'; },
  get token(){ return localStorage.getItem('bt_gh_token') || ''; },
  set token(v){ if (v) localStorage.setItem('bt_gh_token', v); else localStorage.removeItem('bt_gh_token'); },
};
var moPending = null;
var _moSha = null; // sha of the last-read file, required for safe writes
var _moBase = null; // the file exactly as we last saw it on the server — the
                    // common ancestor for merging a concurrent write

// ── Three-way merge ────────────────────────────────────────────────────────
// Mirrors the web app's merge (docs/index.html). The phone holds the whole file
// in memory from load and rewrites the whole file on save, so without a merge a
// stale phone silently reverts whatever the desktop did in the meantime.
// One rule, per field: if we changed it since base, ours wins; else theirs does.
function _clone(o){ return o===undefined ? undefined : JSON.parse(JSON.stringify(o)); }
function _eq(a,b){ return JSON.stringify(a===undefined?null:a) === JSON.stringify(b===undefined?null:b); }

function _mergeObj(base, local, remote){
  base=base||{}; local=local||{}; remote=remote||{};
  var out=_clone(remote), k;
  for (k in local) if (local.hasOwnProperty(k) && !_eq(local[k], base[k])) out[k]=_clone(local[k]);
  for (k in base) if (base.hasOwnProperty(k) && !(k in local) && (k in out) && _eq(base[k], remote[k])) delete out[k];
  return out;
}
function _mergeRecord(base, local, remote){
  var b=base||{}, out=_clone(remote), k;
  for (k in local) if (local.hasOwnProperty(k) && !_eq(local[k], b[k])) out[k]=_clone(local[k]);
  for (k in b) if (b.hasOwnProperty(k) && !(k in local) && (k in out) && _eq(b[k], remote[k])) delete out[k];
  return out;
}
function _mergeById(base, local, remote){
  function idx(a){ var m={}, i; a=a||[]; for(i=0;i<a.length;i++) if(a[i] && a[i].id!=null) m[a[i].id]=a[i]; return m; }
  var B=idx(base), L=idx(local), R=idx(remote);
  var order=[], seen={}, out=[], i, id;
  (remote||[]).forEach(function(x){ if(x&&x.id!=null) order.push(x.id); });
  (local ||[]).forEach(function(x){ if(x&&x.id!=null) order.push(x.id); });
  for (i=0;i<order.length;i++){
    id=order[i];
    if (seen[id]) continue;
    seen[id]=1;
    var b=B[id], l=L[id], r=R[id];
    if (l && r) out.push(_mergeRecord(b, l, r));
    else if (l) { if(!b) out.push(_clone(l)); }   // we added it / they deleted it
    else if (r) { if(!b) out.push(_clone(r)); }   // they added it / we deleted it
  }
  return out;
}
function _mergeSet(base, local, remote){
  base=base||[]; local=local||[]; remote=remote||[];
  var out=remote.slice(), i, v;
  for (i=0;i<local.length;i++){ v=local[i]; if (base.indexOf(v)<0 && out.indexOf(v)<0) out.push(v); }
  for (i=0;i<base.length;i++){ v=base[i]; if (local.indexOf(v)<0 && remote.indexOf(v)>=0){ var j=out.indexOf(v); if(j>=0) out.splice(j,1); } }
  return out;
}
var _MERGE_BY_ID=['transactions','customCategories','recurringIncome'];
var _MERGE_SET=['excludedFromAvg'];
function mergeData(base, local, remote){
  base=base||{}; local=local||{}; remote=remote||{};
  var out=_clone(remote), i, k;
  for (i=0;i<_MERGE_BY_ID.length;i++){ k=_MERGE_BY_ID[i]; out[k]=_mergeById(base[k], local[k], remote[k]); }
  for (i=0;i<_MERGE_SET.length;i++){ k=_MERGE_SET[i]; out[k]=_mergeSet(base[k], local[k], remote[k]); }
  for (k in local){
    if (!local.hasOwnProperty(k)) continue;
    if (_MERGE_BY_ID.indexOf(k)>=0 || _MERGE_SET.indexOf(k)>=0) continue;
    if (local[k] && typeof local[k]==='object' && !Array.isArray(local[k])) out[k]=_mergeObj(base[k], local[k], remote[k]);
    else if (!_eq(local[k], base[k])) out[k]=_clone(local[k]);
  }
  return out;
}

function _b64decodeUtf8(b64){ return decodeURIComponent(escape(atob(String(b64).replace(/\s/g,'')))); }
function _b64encodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }

function moReadData(cb, errCb){
  fetch('https://api.github.com/repos/'+GH.repo+'/contents/'+encodeURIComponent(GH.path)+'?ref='+encodeURIComponent(GH.branch)+'&_='+Date.now(), {
    headers: { 'Authorization':'Bearer '+GH.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' }
  }).then(function(r){
    if (r.status===404){ _moSha=null; cb(null); return; }
    if (r.status===401 || r.status===403){ errCb(new Error('TOKEN')); return; }
    if (!r.ok){ errCb(new Error('HTTP '+r.status)); return; }
    r.json().then(function(j){
      _moSha = j.sha;
      try {
        var parsed = JSON.parse(_b64decodeUtf8(j.content));
        _moBase = _clone(parsed);   // common ancestor for the next merge
        cb(parsed);
      } catch(e){ errCb(new Error('Bad JSON')); }
    });
  }).catch(errCb);
}

// Write the whole data object back. The sha makes the PUT a compare-and-swap: a
// 409/422 means the desktop wrote since we last read. We then merge their file
// with ours against the common ancestor and write the result, so neither side's
// work is lost. cb receives the object actually written — callers must adopt it
// as the new D, or the next save would re-clobber the merged-in changes.
function moWriteData(obj, cb, errCb){
  var attempts = 0;
  function put(body, sha){
    var b = { message:'mobile: '+new Date().toISOString().slice(0,16).replace('T',' '), content:_b64encodeUtf8(JSON.stringify(body, null, 2)), branch:GH.branch };
    if (sha) b.sha = sha;
    return fetch('https://api.github.com/repos/'+GH.repo+'/contents/'+encodeURIComponent(GH.path), {
      method:'PUT',
      headers:{ 'Authorization':'Bearer '+GH.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', 'Content-Type':'application/json' },
      body: JSON.stringify(b)
    });
  }
  var written = obj;
  var base = _moBase;   // the ancestor `written` is a descendant of
  function attempt(){ put(written, _moSha).then(handle).catch(errCb); }
  function handle(r){
    if ((r.status===409 || r.status===422) && attempts < 3){
      attempts++;
      // Re-read to get the other device's file plus a fresh sha, then merge.
      moReadData(function(remote){
        if (!remote){ attempt(); return; }       // file vanished — write ours as-is
        // Merge from `written`, not the original: on a second conflict `written`
        // already carries the first remote's changes, and merging the original
        // again would read those as deletions and drop them.
        written = mergeData(base, written, remote);
        base = remote;
        attempt();
      }, function(){ attempt(); });
      return;
    }
    if (r.status===401 || r.status===403){ errCb(new Error('TOKEN')); return; }
    if (!r.ok){ errCb(new Error('HTTP '+r.status)); return; }
    r.json().then(function(j){
      _moSha = (j.content && j.content.sha) || _moSha;
      _moBase = _clone(written);   // what we just wrote is the new common ancestor
      cb(written);
    }).catch(function(){ _moBase = _clone(written); cb(written); });
  }
  attempt();
}

function moHashPin(pin){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode('bt-identity-v1:'+String(pin))).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
  });
}

    +'<div id="mo-pin-err" style="color:var(--red);font-size:.82rem;min-height:1.1em;margin:16px 0 4px;font-weight:600">'+(msg||'')+'</div>'
    +'<div style="margin-top:6px;font-size:.76rem"><a href="#" onclick="GH.token=\'\';moShowToken(\'\');return false" style="color:#9A8A78">Use a different token</a></div>'
    +'<label aria-hidden="true" style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none"><input id="mo-haptic" type="checkbox" switch tabindex="-1"></label>'
    +'</div>');
  moPinRenderDots();
}
// Haptic feedback. navigator.vibrate covers Android; toggling a hidden
// <input switch> is the only way to trigger the Taptic Engine in iOS Safari
// (17.4+), and only when done inside a user gesture (the key tap handler).
function moHaptic(strong){
  try { if (navigator.vibrate) navigator.vibrate(strong ? [25,30,25] : 8); } catch(e){}
  try { var s=document.getElementById('mo-haptic'); if(s){ s.checked=!s.checked; if(strong){ setTimeout(function(){ s.checked=!s.checked; }, 60); } } } catch(e){}
}
function moPinRenderDots(){
  var box=document.getElementById('mo-dots'); if(!box) return;
  var n=Math.max(4, moPinValue.length), h='';
  for (var i=0;i<n;i++){ h += '<div class="mo-dot'+(i<moPinValue.length?' on':'')+'"></div>'; }
  box.innerHTML=h;
}
function moPinPress(d){
  if(moPinBusy) return;
  var err=document.getElementById('mo-pin-err'); if(err) err.textContent='';
  if(moPinValue.length>=MO_PIN_MAX) return;
  moPinValue += d;
  moHaptic(false);
  moPinRenderDots();
  if(moPinValue.length>=4) moPinTryUnlock();
}
function moPinDel(){
  if(moPinBusy) return;
  var err=document.getElementById('mo-pin-err'); if(err) err.textContent='';
  if(moPinValue.length) moHaptic(false);
  moPinValue = moPinValue.slice(0,-1);
  moPinRenderDots();
}
function moPinFail(){
  moPinBusy=false;
  moHaptic(true);
  var err=document.getElementById('mo-pin-err'); if(err) err.textContent='Incorrect PIN';
  var box=document.getElementById('mo-dots');
  if(box){ box.classList.add('mo-pin-shake'); setTimeout(function(){ box.classList.remove('mo-pin-shake'); }, 420); }
  moPinValue='';
  moPinRenderDots();
}
// Verify as the PIN is typed (no keyboard, like iOS). A match unlocks instantly;
// reaching the max length without a match counts as a failed attempt.
function moPinTryUnlock(){
  var attempt = moPinValue;
  moHashPin(attempt).then(function(h){
    if(attempt!==moPinValue) return;            // value changed (delete/new digit) — ignore stale result
    var a=(moPending&&moPending._auth)||{};
    var person=(a.p1&&h===a.p1)?'p1':(a.p2&&h===a.p2)?'p2':'';
    if(person){
      moPinBusy=true;
      try { sessionStorage.setItem('bt_person', person); } catch(e){}
      moApply(moPending);
    } else if(moPinValue.length>=MO_PIN_MAX){
      moPinFail();
    }
  });
}

function moApply(data){
  D = data;
  var curMoTxns = (D.transactions||[]).filter(function(t){ return t.date && t.date.slice(0,7)===currentMonth; });
  if (curMoTxns.length === 0 && (D.transactions||[]).length > 0) {
    var allMo={}; for (var i=0;i<D.transactions.length;i++){ if(D.transactions[i].date) allMo[D.transactions[i].date.slice(0,7)]=true; }
    var sorted=Object.keys(allMo).sort(); if(sorted.length) currentMonth=sorted[sorted.length-1];
  }
  document.getElementById('status').style.display='none';
  document.getElementById('app').className='show';
  try { render(); } catch(e){ document.getElementById('app').innerHTML='<div style="padding:2rem;color:var(--red);font-size:14px;word-break:break-all"><b>Error:</b><br>'+e.message+'</div>'; }
}

function moStart(){
  if(!GH.token){ moShowToken(''); return; }
  moStatusHtml('<div class="ld-dots"><div></div><div></div><div></div></div><div class="ld-label">Loading</div>');
  moReadData(function(data){
    if(data===null){ moStatusHtml('<div style="text-align:center;padding:24px;color:#9A8A78">No budget yet — open the full web app to set it up first.</div>'); return; }
    moPending=data;
    if(!data._auth || (!data._auth.p1 && !data._auth.p2)){ moStatusHtml('<div style="text-align:center;padding:24px;color:#9A8A78">Set up your PINs in the full web app first.</div>'); return; }
    var sp=''; try{ sp=sessionStorage.getItem('bt_person')||''; }catch(e){}
    if(sp && data._auth[sp]){ moApply(data); return; }
    moShowPin('');
  }, function(e){
    if(e.message==='TOKEN'){ GH.token=''; moShowToken("That token didn't work."); return; }
    document.getElementById('status').innerHTML='<div style="color:var(--red)">Load failed: '+(e.message||e)+'</div>';
  });
}

moStart();
</script>
</body>
</html>
